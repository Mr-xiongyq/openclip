name: Validate group uninstall options
on:
  push:
    branches: [ci/uninstall-options-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Install contributor tools
        run: brew install xcodegen xcbeautify ripgrep
      - name: Check out exact fix
        run: |
          cp scripts/validate_uninstall_ci.py "$RUNNER_TEMP/validate_uninstall_ci.py"
          git fetch origin fix/uninstall-group-options
          git checkout 190e8b08444c19ad04d5b3a7c8a30712e2db175b
          test "$(git rev-parse HEAD)" = 190e8b08444c19ad04d5b3a7c8a30712e2db175b
          xcodegen generate
          sw_vers
          xcodebuild -version
          swift --version
      - name: Quick build gate
        run: python3 "$RUNNER_TEMP/validate_uninstall_ci.py" build
      - name: Prove regression against original uninstall logic
        run: python3 "$RUNNER_TEMP/validate_uninstall_ci.py" baseline
      - name: Full test suite with fix
        run: python3 "$RUNNER_TEMP/validate_uninstall_ci.py" full
      - name: Save validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uninstall-options-macos-logs
          path: ${{ runner.temp }}/openclip-validation/*.log
          retention-days: 7
